name: Build Android App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip files
      run: unzip PrivacySandbox_Project.zip -d myapp

    - name: Fix Kotlin Code Automatically
      run: sed -i 's/while (isActive)/while (serviceScope.isActive)/g' myapp/app/src/main/java/com/research/privacysandbox/service/SocksVpnService.kt

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build APK
      working-directory: ./myapp
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Sandbox-App
        path: myapp/app/build/outputs/apk/debug/app-debug.apk
