name: Build Android App
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip files
      run: unzip PrivacySandbox_Project.zip -d myapp

    - name: Inject New Permissions & Config
      run: |
        cat << 'EOF' > myapp/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.research.privacysandbox">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <application android:allowBackup="false" android:label="StealthProfileManager" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar" android:usesCleartextTraffic="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                </activity>
                <activity android:name=".StealthWebViewActivity" android:configChanges="orientation|screenSize" android:exported="false" android:hardwareAccelerated="true" />
            </application>
        </manifest>
        EOF

    - name: Inject Stealth Database
      run: |
        cat << 'EOF' > myapp/app/src/main/java/com/research/privacysandbox/StealthDatabase.kt
        package com.research.privacysandbox
        import android.content.*
        import android.database.sqlite.*
        data class StealthProfile(val id: Int = 0, val label: String, val targetUrl: String, val proxyHost: String, val proxyPort: Int, val proxyUser: String, val proxyPass: String, val timezone: String, val cpuCores: Int, val memoryGB: Int, val userAgent: String)
        class StealthDatabase(context: Context) : SQLiteOpenHelper(context, "StealthSandbox.db", null, 1) {
            override fun onCreate(db: SQLiteDatabase) { db.execSQL("CREATE TABLE profiles (id INTEGER PRIMARY KEY AUTOINCREMENT, label TEXT, targetUrl TEXT, proxyHost TEXT, proxyPort INTEGER, proxyUser TEXT, proxyPass TEXT, timezone TEXT, cpuCores INTEGER, memoryGB INTEGER, userAgent TEXT)") }
            override fun onUpgrade(db: SQLiteDatabase, oldV: Int, newV: Int) { db.execSQL("DROP TABLE IF EXISTS profiles"); onCreate(db) }
            fun addProfile(p: StealthProfile) { val cv = ContentValues().apply { put("label", p.label); put("targetUrl", p.targetUrl); put("proxyHost", p.proxyHost); put("proxyPort", p.proxyPort); put("proxyUser", p.proxyUser); put("proxyPass", p.proxyPass); put("timezone", p.timezone); put("cpuCores", p.cpuCores); put("memoryGB", p.memoryGB); put("userAgent", p.userAgent) }; writableDatabase.insert("profiles", null, cv) }
            fun getProfiles(): List<StealthProfile> { val list = mutableListOf<StealthProfile>(); val c = readableDatabase.rawQuery("SELECT * FROM profiles", null); while (c.moveToNext()) { list.add(StealthProfile(c.getInt(0), c.getString(1), c.getString(2), c.getString(3), c.getInt(4), c.getString(5), c.getString(6), c.getString(7), c.getInt(8), c.getInt(9), c.getString(10))) }; c.close(); return list }
            fun deleteProfile(id: Int) { writableDatabase.delete("profiles", "id=?", arrayOf(id.toString())) }
        }
        EOF

    - name: Inject New Dashboard UI
      run: |
        cat << 'EOF' > myapp/app/src/main/java/com/research/privacysandbox/MainActivity.kt
        package com.research.privacysandbox
        import android.content.Intent
        import android.graphics.Color
        import android.os.Bundle
        import android.view.*
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        class MainActivity : AppCompatActivity() {
            private lateinit var db: StealthDatabase; private lateinit var container: LinearLayout
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState); db = StealthDatabase(this)
                val root = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#121214")) }
                container = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 40, 40, 40) }
                container.addView(TextView(this).apply { text = "Stealth Profile Manager"; textSize = 24f; setTextColor(Color.parseColor("#9f7aea")); gravity = Gravity.CENTER; setPadding(0, 0, 0, 40) })
                val inputLabel = createInput("Profile Name"); val inputUrl = createInput("Target URL").apply { setText("https://freecash.com") }; val inputHost = createInput("HTTP Proxy Host (IP)"); val inputPort = createInput("Proxy Port"); val inputUser = createInput("Proxy Username"); val inputPass = createInput("Proxy Password"); val inputTimezone = createInput("Timezone").apply { setText("America/New_York") }
                val modelSpinner = Spinner(this).apply { adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("Samsung Galaxy S24 Ultra", "Google Pixel 8 Pro")) }; container.addView(modelSpinner)
                container.addView(Button(this).apply { text = "Create Isolated Profile"; setBackgroundColor(Color.parseColor("#9f7aea")); setTextColor(Color.WHITE); setOnClickListener {
                    if (inputLabel.text.isEmpty() || inputHost.text.isEmpty()) { Toast.makeText(context, "Fill Fields!", Toast.LENGTH_SHORT).show(); return@setOnClickListener }
                    val isSam = modelSpinner.selectedItemPosition == 0
                    db.addProfile(StealthProfile(label = inputLabel.text.toString(), targetUrl = inputUrl.text.toString(), proxyHost = inputHost.text.toString(), proxyPort = inputPort.text.toString().toIntOrNull() ?: 8080, proxyUser = inputUser.text.toString(), proxyPass = inputPass.text.toString(), timezone = inputTimezone.text.toString(), cpuCores = if (isSam) 8 else 9, memoryGB = if (isSam) 12 else 16, userAgent = if (isSam) "Mozilla/5.0 (Linux; Android 14; SM-S928B) Chrome/124.0 Mobile" else "Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) Chrome/124.0 Mobile"))
                    refreshProfiles()
                } })
                root.addView(container); setContentView(root); refreshProfiles()
            }
            private fun createInput(h: String) = EditText(this).apply { hint = h; setHintTextColor(Color.GRAY); setTextColor(Color.WHITE); setPadding(20, 20, 20, 20) }.also { container.addView(it) }
            private fun refreshProfiles() {
                if (container.childCount > 10) container.removeViews(10, container.childCount - 10)
                db.getProfiles().forEach { profile ->
                    val card = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#1e1e24")); setPadding(30, 30, 30, 30); layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 20, 0, 20) } }
                    card.addView(TextView(this).apply { text = "📁 ${profile.label}\n🔗 Host: ${profile.proxyHost}:${profile.proxyPort}"; setTextColor(Color.WHITE) })
                    val btns = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                    btns.addView(Button(this).apply { text = "Launch"; setBackgroundColor(Color.parseColor("#48bb78")); setTextColor(Color.WHITE); setOnClickListener { startActivity(Intent(this@MainActivity, StealthWebViewActivity::class.java).apply { putExtra("url", profile.targetUrl); putExtra("host", profile.proxyHost); putExtra("port", profile.proxyPort); putExtra("user", profile.proxyUser); putExtra("pass", profile.proxyPass); putExtra("tz", profile.timezone); putExtra("cores", profile.cpuCores); putExtra("ram", profile.memoryGB); putExtra("ua", profile.userAgent); putExtra("id", profile.id) }) } })
                    btns.addView(Button(this).apply { text = "Delete"; setBackgroundColor(Color.parseColor("#e53e3e")); setTextColor(Color.WHITE); setOnClickListener { db.deleteProfile(profile.id); refreshProfiles() } })
                    card.addView(btns); container.addView(card)
                }
            }
        }
        EOF

    - name: Inject Isolated WebView Core
      run: |
        cat << 'EOF' > myapp/app/src/main/java/com/research/privacysandbox/StealthWebViewActivity.kt
        package com.research.privacysandbox
        import android.annotation.SuppressLint
        import android.net.ProxyInfo
        import android.os.Bundle
        import android.webkit.*
        import androidx.appcompat.app.AppCompatActivity
        class StealthWebViewActivity : AppCompatActivity() {
            @SuppressLint("SetJavaScriptEnabled")
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val url = intent.getStringExtra("url") ?: "https://freecash.com"; val host = intent.getStringExtra("host") ?: ""; val port = intent.getIntExtra("port", 8080); val user = intent.getStringExtra("user") ?: ""; val pass = intent.getStringExtra("pass") ?: ""; val tz = intent.getStringExtra("tz") ?: "America/New_York"; val cores = intent.getIntExtra("cores", 8); val ram = intent.getIntExtra("ram", 12); val ua = intent.getStringExtra("ua") ?: ""; val seed = intent.getIntExtra("id", 0)
                val wv = WebView(this); setContentView(wv)
                CookieManager.getInstance().apply { setAcceptCookie(true); setAcceptThirdPartyCookies(wv, true) }
                wv.settings.apply { javaScriptEnabled = true; domStorageEnabled = true; userAgentString = ua }
                try {
                    val p = Class.forName("android.webkit.WebViewFactory").getMethod("getProvider").invoke(null)
                    val pc = p.javaClass.getMethod("getProxyController").invoke(p)
                    pc.javaClass.getMethod("setProxyOverride", Array<String>::class.java, Array<String>::class.java, Runnable::class.java).invoke(pc, arrayOf("http://$host:$port", "https://$host:$port"), arrayOf("localhost"), Runnable {})
                } catch (e: Exception) {}
                wv.webViewClient = object : WebViewClient() {
                    override fun onReceivedHttpAuthRequest(v: WebView?, h: HttpAuthHandler?, ho: String?, r: String?) { h?.proceed(user, pass) }
                    override fun onPageFinished(v: WebView?, u: String?) {
                        wv.evaluateJavascript("javascript:(function(){Intl.DateTimeFormat.prototype.resolvedOptions=()=>({timeZone:'$tz'});Object.defineProperty(navigator,'hardwareConcurrency',{get:()=>$cores});Object.defineProperty(navigator,'deviceMemory',{get:()=>$ram});Object.defineProperty(navigator,'webdriver',{get:()=>false});const o=CanvasRenderingContext2D.prototype.getImageData;CanvasRenderingContext2D.prototype.getImageData=function(){const i=o.apply(this,arguments);for(let k=0;k<i.data.length;k+=4)i.data[k]=i.data[k]^($seed%3);return i};window.RTCPeerConnection=function(){}})()", null)
                    }
                }
                wv.loadUrl(url)
            }
        }
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build APK
      working-directory: ./myapp
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Stealth-Sandbox-App
        path: myapp/app/build/outputs/apk/debug/app-debug.apk
